<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Login Form</h2>

    <form action="login" method="post">

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <br>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <br>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
